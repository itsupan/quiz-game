sonar.projectKey=itsupan_quiz-game
sonar.organization=itsupan

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=quiz-game
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.tests=tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclude specific files or directories
sonar.exclusions=node_modules/**,.svelte-kit/**,build/**,.wrangler/**,**/*.spec.ts,**/*.test.ts,**/*.e2e.ts

sonar.test.inclusions=tests/**

# Duplication detection skips generated SQL. drizzle-kit writes these files, and its output
# necessarily repeats itself: a schema change SQLite cannot express as ALTER is emitted as a
# full CREATE TABLE plus INSERT ... SELECT, so every such migration restates the whole table.
# That is the tool's format, not copy-paste, and editing it to satisfy a duplication metric
# would mean hand-maintaining generated files.
sonar.cpd.exclusions=migrations/**
