openapi: 3.1.0
info:
  title: Quiz Game Learner API
  version: 1.0.0
  description: |
    Same-origin JSON API for authenticated learner quiz sessions. The server clock and
    returned deadlines are authoritative. Correct answers and review-only content are
    withheld until an attempt is submitted or expires.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Quizzes
  - name: Attempts
paths:
  /quizzes:
    get:
      tags: [Quizzes]
      summary: List published quizzes
      parameters:
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Mode'
        - $ref: '#/components/parameters/Section'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Published quiz page
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuizSummary'
                  page:
                    type: object
                    required: [nextCursor]
                    properties:
                      nextCursor:
                        oneOf:
                          - $ref: '#/components/schemas/PublicId'
                          - type: 'null'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /quizzes/{quizId}:
    parameters:
      - $ref: '#/components/parameters/QuizId'
    get:
      tags: [Quizzes]
      summary: Load a published quiz overview
      responses:
        '200':
          description: Published quiz with its ordered sections
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/QuizOverview'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /quizzes/{quizId}/attempts:
    parameters:
      - $ref: '#/components/parameters/QuizId'
    post:
      tags: [Attempts]
      summary: Start a quiz attempt
      description: |
        Idempotency-Key is scoped to the authenticated learner. Reusing it for the same
        quiz returns the original attempt; reusing it for another quiz returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Attempt created; Location identifies the attempt resource
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartedAttemptEnvelope'
        '200':
          description: A retry returning the previously created attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartedAttemptEnvelope'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Attempts]
      summary: Load attempt state and progress
      responses:
        '200':
          description: Attempt metadata with ordered question links and authoritative deadlines
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /attempts/{attemptId}/questions/{questionNumber}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
      - $ref: '#/components/parameters/QuestionNumber'
    get:
      tags: [Attempts]
      summary: Load one served question
      description: Does not return the answer key, correctness, explanation, or transcript.
      responses:
        '200':
          description: Served question
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AttemptQuestion'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /attempts/{attemptId}/answers/{questionNumber}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
      - $ref: '#/components/parameters/QuestionNumber'
    put:
      tags: [Attempts]
      summary: Save, replace, or clear an answer
      description: The operation is idempotent. Null explicitly clears the saved selection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selectedOptionNumber]
              properties:
                selectedOptionNumber:
                  oneOf:
                    - type: integer
                      minimum: 1
                    - type: 'null'
            examples:
              select:
                value: { selectedOptionNumber: 2 }
              clear:
                value: { selectedOptionNumber: null }
      responses:
        '200':
          description: Updated question state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AttemptQuestion'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /attempts/{attemptId}/abandonment:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    put:
      tags: [Attempts]
      summary: Exit an attempt without scoring it
      description: |
        Transitions an in-progress attempt to ABANDONED. Repeating the request is
        idempotent. If the deadline has already passed, the server settles the attempt as
        EXPIRED instead. An abandoned attempt has no result and earns no reward.
      responses:
        '200':
          description: Abandoned attempt
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AbandonedAttempt'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /attempts/{attemptId}/submission:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    put:
      tags: [Attempts]
      summary: Submit and score an attempt
      description: Repeating this request returns the same terminal result without rescoring.
      responses:
        '200':
          description: Completed result; Location identifies the result resource
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /attempts/{attemptId}/result:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      tags: [Attempts]
      summary: Load a completed result
      responses:
        '200':
          description: Score and answer review for a submitted or expired attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultEnvelope'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Existing same-origin Quiz Game session cookie.
  parameters:
    QuizId:
      name: quizId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    QuestionNumber:
      name: questionNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Level:
      name: level
      in: query
      schema:
        $ref: '#/components/schemas/Level'
    Mode:
      name: mode
      in: query
      schema:
        $ref: '#/components/schemas/Mode'
    Section:
      name: section
      in: query
      schema:
        $ref: '#/components/schemas/Section'
    Cursor:
      name: cursor
      in: query
      schema:
        $ref: '#/components/schemas/PublicId'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    Problem:
      description: Machine-readable API error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PublicId:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      example: 01JSEEDQZN4EXAM00000000000
    Level:
      type: string
      enum: [N5, N4, N3, N2, N1]
    Mode:
      type: string
      enum: [JLPT_PRACTICE, MOCK_TEST, FULL_EXAM]
    Section:
      type: string
      enum: [VOCAB_KANJI, GRAMMAR_READING, LISTENING]
    AttemptStatus:
      type: string
      enum: [IN_PROGRESS, SUBMITTED, EXPIRED, ABANDONED]
    QuestionFormat:
      type: string
      enum:
        [
          STANDARD,
          VOCABULARY_MEANING,
          KANJI_READING,
          GRAMMAR_CLOZE,
          READING_COMPREHENSION,
          LISTENING_COMPREHENSION
        ]
    GroupFormat:
      type: string
      enum: [READING_PASSAGE, LISTENING_CLIP, CONCEPT_REVIEW]
    QuizBase:
      type: object
      required: [id, title, description, level, mode, selectionMode, icon, timeLimitSeconds]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        title:
          type: string
        description:
          type: [string, 'null']
        level:
          $ref: '#/components/schemas/Level'
        mode:
          $ref: '#/components/schemas/Mode'
        selectionMode:
          type: string
          enum: [FIXED, RANDOM]
        icon:
          type: string
          enum:
            [book, flask, calculator, headphones, microphone, brain, pencil, graduation-cap, trophy]
        timeLimitSeconds:
          type: [integer, 'null']
    QuizSummary:
      allOf:
        - $ref: '#/components/schemas/QuizBase'
        - type: object
          required: [sections]
          properties:
            sections:
              type: array
              items:
                $ref: '#/components/schemas/Section'
    QuizOverview:
      allOf:
        - $ref: '#/components/schemas/QuizBase'
        - type: object
          required: [sections]
          properties:
            sections:
              type: array
              items:
                type: object
                required: [section, position, timeLimitSeconds, questionCount]
                properties:
                  section:
                    $ref: '#/components/schemas/Section'
                  position:
                    type: integer
                  timeLimitSeconds:
                    type: [integer, 'null']
                  questionCount:
                    type: integer
    StartedAttemptEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status, links]
          properties:
            id:
              $ref: '#/components/schemas/PublicId'
            status:
              const: IN_PROGRESS
            links:
              type: object
    Attempt:
      type: object
      required:
        [
          id,
          status,
          serverTime,
          startedAt,
          attemptExpiresAt,
          activeSection,
          sectionExpiresAt,
          quiz,
          progress,
          sections,
          questions,
          links
        ]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        status:
          $ref: '#/components/schemas/AttemptStatus'
        serverTime:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        attemptExpiresAt:
          type: [string, 'null']
          format: date-time
        activeSection:
          oneOf:
            - $ref: '#/components/schemas/Section'
            - type: 'null'
        sectionExpiresAt:
          type: [string, 'null']
          format: date-time
        quiz:
          type: object
        progress:
          type: object
        sections:
          type: array
          items:
            type: object
        questions:
          type: array
          items:
            type: object
        links:
          type: object
    AttemptQuestion:
      type: object
      description: In-progress representation; intentionally has no answer-key fields.
      required:
        [
          attemptId,
          attemptStatus,
          serverTime,
          number,
          section,
          points,
          stem,
          presentation,
          image,
          audio,
          options,
          selectedOptionNumber,
          progress,
          canAnswer,
          links
        ]
      properties:
        attemptId:
          $ref: '#/components/schemas/PublicId'
        attemptStatus:
          $ref: '#/components/schemas/AttemptStatus'
        serverTime:
          type: string
          format: date-time
        number:
          type: integer
        section:
          $ref: '#/components/schemas/Section'
        points:
          type: integer
        stem:
          type: string
        presentation:
          $ref: '#/components/schemas/QuestionPresentation'
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageMedia'
            - type: 'null'
        audio:
          oneOf:
            - $ref: '#/components/schemas/AudioMedia'
            - type: 'null'
        options:
          type: array
          items:
            type: object
            required: [number, body]
            properties:
              number:
                type: integer
              body:
                type: string
        selectedOptionNumber:
          type: [integer, 'null']
        progress:
          type: object
          required: [current, total, answered]
          properties:
            current:
              type: integer
              minimum: 1
            total:
              type: integer
              minimum: 1
            answered:
              type: integer
              minimum: 0
        canAnswer:
          type: boolean
        links:
          type: object
          required: [attempt, answer, previous, next]
          properties:
            attempt:
              type: string
            answer:
              type: string
            previous:
              type: [string, 'null']
            next:
              type: [string, 'null']
    AbandonedAttempt:
      type: object
      required: [id, status, links]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        status:
          const: ABANDONED
        links:
          type: object
          required: [quiz, catalog]
          properties:
            quiz:
              type: string
            catalog:
              type: string
    ResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [attempt, quiz, reward, summary, bandScores, questions, links]
          properties:
            attempt:
              type: object
            quiz:
              type: object
            reward:
              $ref: '#/components/schemas/ResultReward'
            summary:
              $ref: '#/components/schemas/ResultSummary'
            bandScores:
              type: array
              items:
                type: object
            questions:
              type: array
              items:
                $ref: '#/components/schemas/ResultQuestion'
            links:
              type: object
              required: [attempt, quiz, retry]
              properties:
                attempt:
                  type: string
                quiz:
                  type: string
                retry:
                  type: string
    ResultSummary:
      type: object
      required: [accuracyPercent, correctCount, incorrectCount, unansweredCount, durationMs]
      properties:
        accuracyPercent:
          type: integer
          minimum: 0
          maximum: 100
        correctCount:
          type: integer
          minimum: 0
        incorrectCount:
          type: integer
          minimum: 0
        unansweredCount:
          type: integer
          minimum: 0
        durationMs:
          type: [integer, 'null']
          minimum: 0
    ResultReward:
      type: object
      required: [xpAwarded]
      properties:
        xpAwarded:
          type: integer
          minimum: 0
    Prompt:
      type: object
      required: [text, translation]
      properties:
        text:
          type: string
        translation:
          type: [string, 'null']
          description: Null when absent or withheld by the frozen quiz study-aid policy.
    ImageMedia:
      type: object
      required: [id, url, mimeType, width, height, altText]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        url:
          type: string
        mimeType:
          type: [string, 'null']
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        altText:
          type: [string, 'null']
    AudioMedia:
      type: object
      required: [id, url, mimeType, durationMs]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        url:
          type: string
        mimeType:
          type: [string, 'null']
        durationMs:
          type: [integer, 'null']
        transcript:
          type: [string, 'null']
          description: Present only in completed results, never active attempts.
    ExampleText:
      type: object
      required: [text, transliteration, translation]
      properties:
        text:
          type: string
        transliteration:
          type: [string, 'null']
        translation:
          type: [string, 'null']
    Stimulus:
      type: object
      required: [id, type, title, instruction, body, bodyTranslation, example, image, audio]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        type:
          $ref: '#/components/schemas/GroupFormat'
        title:
          type: [string, 'null']
        instruction:
          type: [string, 'null']
        body:
          type: [string, 'null']
        bodyTranslation:
          type: [string, 'null']
          description: Null while withheld by the frozen quiz study-aid policy.
        example:
          oneOf:
            - $ref: '#/components/schemas/ExampleText'
            - type: 'null'
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageMedia'
            - type: 'null'
        audio:
          oneOf:
            - $ref: '#/components/schemas/AudioMedia'
            - type: 'null'
    StandardPresentation:
      type: object
      required: [type, prompt]
      properties:
        type:
          const: STANDARD
        prompt:
          $ref: '#/components/schemas/Prompt'
    FocusPresentation:
      type: object
      required: [type, prompt, focus]
      properties:
        type:
          enum: [VOCABULARY_MEANING, KANJI_READING]
        prompt:
          $ref: '#/components/schemas/Prompt'
        focus:
          type: object
          required: [text, reading]
          properties:
            text:
              type: [string, 'null']
            reading:
              type: [string, 'null']
    GrammarPresentation:
      type: object
      required: [type, prompt, context, studyAid]
      properties:
        type:
          const: GRAMMAR_CLOZE
        prompt:
          $ref: '#/components/schemas/Prompt'
        context:
          type: object
          required: [text, transliteration]
          properties:
            text:
              type: [string, 'null']
            transliteration:
              type: [string, 'null']
        studyAid:
          oneOf:
            - $ref: '#/components/schemas/Stimulus'
            - type: 'null'
    GroupPresentation:
      type: object
      required: [type, prompt, stimulus]
      properties:
        type:
          enum: [READING_COMPREHENSION, LISTENING_COMPREHENSION]
        prompt:
          $ref: '#/components/schemas/Prompt'
        stimulus:
          oneOf:
            - $ref: '#/components/schemas/Stimulus'
            - type: 'null'
    QuestionPresentation:
      oneOf:
        - $ref: '#/components/schemas/StandardPresentation'
        - $ref: '#/components/schemas/FocusPresentation'
        - $ref: '#/components/schemas/GrammarPresentation'
        - $ref: '#/components/schemas/GroupPresentation'
      discriminator:
        propertyName: type
    ResultQuestion:
      type: object
      description: Review representation with answer-key and review-only content.
      required:
        [
          number,
          section,
          points,
          stem,
          explanation,
          presentation,
          image,
          audio,
          options,
          selectedOptionNumber,
          correctOptionNumber,
          isCorrect,
          pointsEarned
        ]
      properties:
        number:
          type: integer
        section:
          $ref: '#/components/schemas/Section'
        points:
          type: integer
        stem:
          type: string
        explanation:
          type: [string, 'null']
        presentation:
          $ref: '#/components/schemas/QuestionPresentation'
        image:
          oneOf:
            - $ref: '#/components/schemas/ImageMedia'
            - type: 'null'
        audio:
          oneOf:
            - $ref: '#/components/schemas/AudioMedia'
            - type: 'null'
        options:
          type: array
          items:
            type: object
            required: [number, body]
            properties:
              number:
                type: integer
              body:
                type: string
        selectedOptionNumber:
          type: [integer, 'null']
        correctOptionNumber:
          type: [integer, 'null']
        isCorrect:
          type: boolean
        pointsEarned:
          type: integer
    Problem:
      type: object
      required: [type, title, status, detail, instance, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
