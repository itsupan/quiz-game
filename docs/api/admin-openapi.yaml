        updatedAt:
          type: string
          format: date-time
    QuestionDetail:
      allOf:
        - $ref: '#/components/schemas/QuestionListItem'
        - type: object
          required:
            - explanation
            - promptTranslation
            - focusText
            - focusReading
            - contextText
            - contextTransliteration
            - image
            - audio
            - groupId
            - groupPosition
            - options
            - blockers
          properties:
            explanation:
              type: [string, 'null']
            promptTranslation:
              type: [string, 'null']
            focusText:
              type: [string, 'null']
              description: 'VOCABULARY_MEANING/KANJI_READING: the large focus term.'
            focusReading:
              type: [string, 'null']
            contextText:
              type: [string, 'null']
              description: 'GRAMMAR_CLOZE: the sentence containing exactly one ___ token.'
            contextTransliteration:
              type: [string, 'null']
            image:
              $ref: '#/components/schemas/MediaRef'
            audio:
              $ref: '#/components/schemas/MediaRef'
            groupId:
              oneOf:
                - $ref: '#/components/schemas/PublicId'
                - type: 'null'
            groupPosition:
              type: [integer, 'null']
            options:
              type: array
              items:
                $ref: '#/components/schemas/QuestionOption'
            blockers:
              type: array
              items:
                type: string
    QuestionWriteBody:
      type: object
      description: |
        A create requires stem, level, section and options; every other field is
        optional and defaults as documented in the coverage plan. A patch merges onto
        the current question: an omitted field (including groupId) is unchanged, an
        explicit null clears it. Unknown fields are rejected.
      properties:
        stem:
          type: string
        explanation:
          type: [string, 'null']
        level:
          $ref: '#/components/schemas/Level'
        section:
          $ref: '#/components/schemas/Section'
        format:
          $ref: '#/components/schemas/QuestionFormat'
        promptTranslation:
          type: [string, 'null']
        focusText:
          type: [string, 'null']
        focusReading:
          type: [string, 'null']
        contextText:
          type: [string, 'null']
        contextTransliteration:
          type: [string, 'null']
        points:
          type: integer
          minimum: 1
        imageId:
          type: [string, 'null']
        audioId:
          type: [string, 'null']
        groupId:
          type: [string, 'null']
          description: A question group's public id, or null to detach.
        groupPosition:
          type: [integer, 'null']
          minimum: 1
        options:
          type: array
          minItems: 2
          items:
            type: object
            required: [body, isCorrect]
            properties:
              body:
                type: string
              isCorrect:
                type: boolean
