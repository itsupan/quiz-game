            bodyTranslation:
              type: [string, 'null']
            instruction:
              type: [string, 'null']
            exampleText:
              type: [string, 'null']
            exampleTransliteration:
              type: [string, 'null']
            exampleTranslation:
              type: [string, 'null']
            image:
              $ref: '#/components/schemas/MediaRef'
            audio:
              $ref: '#/components/schemas/MediaRef'
            blockers:
              type: array
              items:
                type: string
    GroupWriteBody:
      type: object
      description: |
        A create requires level, section and format; every other field is optional.
        A patch merges onto the current group: an omitted field is unchanged, an
        explicit null clears it. Unknown fields are rejected.
      properties:
        level:
          $ref: '#/components/schemas/Level'
        section:
          $ref: '#/components/schemas/Section'
        format:
          $ref: '#/components/schemas/GroupFormat'
        title:
          type: [string, 'null']
        body:
          type: [string, 'null']
        instruction:
          type: [string, 'null']
        bodyTranslation:
          type: [string, 'null']
        exampleText:
          type: [string, 'null']
        exampleTransliteration:
          type: [string, 'null']
        exampleTranslation:
          type: [string, 'null']
        imageId:
          type: [string, 'null']
          description: A media asset's public id, or null to detach.
        audioId:
          type: [string, 'null']
    QuestionOption:
      type: object
      required: [body, isCorrect, position]
      properties:
        body:
          type: string
        isCorrect:
          type: boolean
        position:
          type: integer
    QuestionListItem:
      type: object
      required:
        [
          id,
          stem,
          level,
          section,
          format,
          status,
          points,
          optionCount,
          hasAnswerKey,
          createdAt,
          updatedAt
        ]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        stem:
          type: string
        level:
          $ref: '#/components/schemas/Level'
        section:
          $ref: '#/components/schemas/Section'
        format:
          $ref: '#/components/schemas/QuestionFormat'
        status:
