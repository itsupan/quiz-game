openapi: 3.1.0
info:
  title: Quiz Game Admin Content API
  version: 1.0.0
  description: |
    Same-origin JSON API for authenticated administrators authoring quiz content: the
    six question formats, shared reading/listening/concept-review groups, and quiz
    authoring fields. Content is archived, never deleted. Every mutating request is
    same-origin only and every identifier in a payload is a public ULID, never an
    internal numeric id. `docs/api/openapi.yaml` documents the separate learner-facing
    attempt API; this document covers only the admin authoring surface package 1 added
    or extended (question groups, and the new question/quiz fields).
servers:
  - url: /api/v1/admin
security:
  - sessionCookie: []
tags:
  - name: Overview
  - name: Users
  - name: AuditLogs
  - name: QuestionGroups
  - name: Questions
  - name: Quizzes
paths:
  /overview:
    get:
      tags: [Overview]
      summary: Read dashboard totals, recent activity, and system health
      responses:
        '200':
          description: Data for the admin dashboard
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminOverview'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /users:
    get:
      tags: [Users]
      summary: List and filter users
      parameters:
        - name: search
          in: query
          description: Matches display name, email, or public id.
          schema:
            type: string
        - $ref: '#/components/parameters/Level'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Users]
      summary: Pre-provision a learner account
      description: The learner signs in later with a verified Google account using the same email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateBody'
      responses:
        '201':
          description: The created user's public id
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PublicId'
    get:
      tags: [Users]
      summary: Read a user
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Users]
      summary: Update a user's profile, role, or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatchBody'
      responses:
        '200':
          description: The updated user
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /audit-logs:
    get:
      tags: [AuditLogs]
      summary: List system audit entries
      parameters:
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: entityType
          in: query
          schema:
            $ref: '#/components/schemas/AuditEntityType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /question-groups:
    get:
      tags: [QuestionGroups]
      summary: List question groups
      parameters:
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Section'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/GroupFormat'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of question groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [QuestionGroups]
      summary: Create a question group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWriteBody'
      responses:
        '201':
          description: The created group's public id
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        $ref: '#/components/schemas/PublicId'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /question-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [QuestionGroups]
      summary: Read a question group, including publish blockers
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GroupDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [QuestionGroups]
      summary: Update a question group
      description: |
        Every field follows "omitted keeps the current value, explicit null clears it" —
        an update that does not mention a field never erases it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWriteBody'
      responses:
        '200':
          description: The updated group
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GroupDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /question-groups/{groupId}/publication:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      tags: [QuestionGroups]
      summary: Publish a question group
      description: |
        Fails with 409 and a list of blockers when the group is not ready: a reading
        passage needs non-empty body text, a listening clip needs an attached audio
        asset with a transcript, a concept-review group needs explanatory body text and
        a usable example, and any attached image needs alt text.
      responses:
        '200':
          description: The published group
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GroupDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [QuestionGroups]
      summary: Archive a question group
      description: Archives the group (sets status to ARCHIVED); it is never deleted.
      responses:
        '200':
          description: The archived group
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GroupDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /questions:
    get:
      tags: [Questions]
      summary: List questions
      parameters:
        - $ref: '#/components/parameters/Level'
        - $ref: '#/components/parameters/Section'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/QuestionFormat'
        - $ref: '#/components/parameters/GroupIdFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of questions
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuestionListItem'
                  page:
                    $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      tags: [Questions]
      summary: Create a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionWriteBody'
      responses:
        '201':
          description: The created question's public id
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        $ref: '#/components/schemas/PublicId'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [Questions]
      summary: Read a question, including its answer key and publish blockers
      responses:
        '200':
          description: The question
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/QuestionDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Questions]
      summary: Update a question
      description: |
        Every field, including `groupId`, follows "omitted keeps the current value,
        explicit null clears it" — an update that does not mention `groupId` never
        silently detaches an attached group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionWriteBody'
      responses:
        '200':
          description: The updated question
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/QuestionDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /questions/{questionId}/publication:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    put:
      tags: [Questions]
      summary: Publish a question
      description: |
        Fails with 409 and a list of blockers when the question is not ready. Blockers
        are format-aware: `VOCABULARY_MEANING`/`KANJI_READING` need a non-empty
        `focusText`; `GRAMMAR_CLOZE` needs a `contextText` with exactly one `___` token;
        `READING_COMPREHENSION`/`LISTENING_COMPREHENSION` need an attached, published,
        ready group of the matching type.
      responses:
        '200':
          description: The published question
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/QuestionDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Questions]
      summary: Archive a question
      description: Archives the question (sets status to ARCHIVED); it is never deleted.
      responses:
        '200':
          description: The archived question
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/QuestionDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /quizzes/{quizId}:
    parameters:
      - $ref: '#/components/parameters/QuizId'
    patch:
      tags: [Quizzes]
      summary: Update quiz authoring fields relevant to this package
      description: |
        Package 1 adds `showStudyAidsDuringAttempt` and `xpReward` to the existing quiz
        create/detail/patch contract (title, description, mode, level, selectionMode,
        timeLimitSeconds — documented alongside the rest of the admin quiz API). Learner
        endpoints never accept either field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                showStudyAidsDuringAttempt:
                  type: boolean
                xpReward:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: The updated quiz
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [showStudyAidsDuringAttempt, xpReward]
                    properties:
                      showStudyAidsDuringAttempt:
                        type: boolean
                      xpReward:
                        type: integer
                        minimum: 0
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Same-origin session cookie for a signed-in, active ADMIN account.
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    QuizId:
      name: quizId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    Level:
      name: level
      in: query
      schema:
        $ref: '#/components/schemas/Level'
    Section:
      name: section
      in: query
      schema:
        $ref: '#/components/schemas/Section'
    Status:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/ContentStatus'
    GroupFormat:
      name: format
      in: query
      schema:
        $ref: '#/components/schemas/GroupFormat'
    QuestionFormat:
      name: format
      in: query
      schema:
        $ref: '#/components/schemas/QuestionFormat'
    GroupIdFilter:
      name: groupId
      in: query
      description: A group's public id. An id that resolves to no group matches nothing.
      schema:
        $ref: '#/components/schemas/PublicId'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 25
  responses:
    Problem:
      description: Machine-readable API error (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PublicId:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      example: 01JSEEDGRPRDNG000000000000
    Level:
      type: string
      enum: [N5, N4, N3, N2, N1]
    UserRole:
      type: string
      enum: [USER, ADMIN]
    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]
    AuditAction:
      type: string
      enum:
        - USER_CREATED
        - USER_PROFILE_CHANGED
        - USER_ROLE_CHANGED
        - USER_STATUS_CHANGED
        - QUIZ_PUBLISHED
        - QUIZ_ARCHIVED
        - QUESTION_PUBLISHED
        - QUESTION_ARCHIVED
        - QUESTION_GROUP_CREATED
        - QUESTION_GROUP_UPDATED
        - QUESTION_GROUP_PUBLISHED
        - QUESTION_GROUP_ARCHIVED
        - MEDIA_DELETED
    AuditEntityType:
      type: string
      enum: [quiz, question, question_group, media_asset, user]
    Section:
      type: string
      enum: [VOCAB_KANJI, GRAMMAR_READING, LISTENING]
    ContentStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    QuestionFormat:
      type: string
      enum:
        - STANDARD
        - VOCABULARY_MEANING
        - KANJI_READING
        - GRAMMAR_CLOZE
        - READING_COMPREHENSION
        - LISTENING_COMPREHENSION
    GroupFormat:
      type: string
      enum: [READING_PASSAGE, LISTENING_CLIP, CONCEPT_REVIEW]
    Problem:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    Page:
      type: object
      required: [number, size, total, totalPages]
      properties:
        number:
          type: integer
        size:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    User:
      type: object
      required: [id, email, displayName, jlptLevel, role, status, lastLoginAt, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        email:
          type: string
          format: email
        displayName:
          type: string
        jlptLevel:
          oneOf:
            - $ref: '#/components/schemas/Level'
            - type: 'null'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserCreateBody:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        jlptLevel:
          oneOf:
            - $ref: '#/components/schemas/Level'
            - type: 'null'
    UserPatchBody:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        jlptLevel:
          oneOf:
            - $ref: '#/components/schemas/Level'
            - type: 'null'
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    UserListPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          $ref: '#/components/schemas/Page'
    AuditActor:
      type: object
      nullable: true
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        displayName:
          type: string
    AuditEntity:
      type: object
      required: [id, type, label]
      properties:
        id:
          oneOf:
            - $ref: '#/components/schemas/PublicId'
            - type: 'null'
        type:
          $ref: '#/components/schemas/AuditEntityType'
        label:
          type: string
    AuditLog:
      type: object
      required: [action, actor, entity, before, after, createdAt]
      properties:
        action:
          type: string
          description: Usually an AuditAction; older/future rows remain readable.
        actor:
          $ref: '#/components/schemas/AuditActor'
        entity:
          $ref: '#/components/schemas/AuditEntity'
        before: {}
        after: {}
        createdAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        page:
          $ref: '#/components/schemas/Page'
    AdminOverview:
      type: object
      required: [students, quizzes, questions, attempts, recentActivity, health]
      properties:
        students:
          type: object
          required: [total, suspendedAccounts]
          properties:
            total:
              type: integer
            suspendedAccounts:
              type: integer
        quizzes:
          type: object
          required: [total, active, draft]
          properties:
            total:
              type: integer
            active:
              type: integer
            draft:
              type: integer
        questions:
          type: object
        attempts:
          type: object
        recentActivity:
          type: array
          maxItems: 5
          items:
            type: object
            required: [action, actor, entity, createdAt]
            properties:
              action:
                type: string
              actor:
                $ref: '#/components/schemas/AuditActor'
              entity:
                $ref: '#/components/schemas/AuditEntity'
              createdAt:
                type: string
                format: date-time
        health:
          type: object
          required: [status, database]
          properties:
            status:
              const: OPERATIONAL
            database:
              const: CONNECTED
    MediaRef:
      type: object
      nullable: true
      required: [id, url]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        url:
          type: string
        altText:
          type: [string, 'null']
        transcript:
          type: [string, 'null']
    GroupListItem:
      type: object
      required: [id, level, section, format, title, status, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        level:
          $ref: '#/components/schemas/Level'
        section:
          $ref: '#/components/schemas/Section'
        format:
          $ref: '#/components/schemas/GroupFormat'
        title:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ContentStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GroupListPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GroupListItem'
        page:
          $ref: '#/components/schemas/Page'
    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/GroupListItem'
        - type: object
          required:
            - body
