<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · quiz-game</title>
		<!--
			The fallback page for an error thrown before any layout renders — notably from
			hooks.server.ts, where the admin guard lives. SvelteKit's default is an unstyled
			status code on a blank page with no way back, which is how a 403 ended up looking
			like the site was broken.
		-->
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-content: center;
				gap: 0.75rem;
				text-align: center;
				padding: 2rem;
				background: #f4f6f9;
				color: #16181d;
				font-family:
					system-ui,
					-apple-system,
					'Hiragino Sans',
					'Noto Sans JP',
					Meiryo,
					sans-serif;
				line-height: 1.6;
			}
			.status {
				font-size: 0.8125rem;
				text-transform: uppercase;
				letter-spacing: 0.06em;
				color: #8b94a3;
			}
			h1 {
				margin: 0;
				font-size: 1.25rem;
				font-weight: 650;
			}
			a {
				color: #2f5bd7;
			}
		</style>
	</head>
	<body>
		<p class="status">Error %sveltekit.status%</p>
		<h1>%sveltekit.error.message%</h1>
		<p><a href="/">Back to quiz-game</a></p>
	</body>
</html>
